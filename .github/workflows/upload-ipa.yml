name: Build and Distribute

on:
  push:
    branches-ignore:
      - main
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: build
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: get and extract files
        run: |
          cat splitfile* > Runner.ipa.zip
          unzip Runner.ipa.zip

      - name: Archive IPA
        uses: actions/upload-artifact@v4
        with:
          name: release-ipa
          path: Runner.ipa
          retention-days: 0.5  # 设置工件保留 0.5天， 可根据需要调整

      - name: Load configuration
        id: config
        run: |
          # 读取配置文件并设置为输出变量
          echo "APPLE_ISSUER_ID=$(grep "^APPLE_ISSUER_ID=" config.properties | cut -d'=' -f2 | tr -d '\r')" >> $GITHUB_OUTPUT
          echo "APPLE_KEY_ID=$(grep "^APPLE_KEY_ID=" config.properties | cut -d'=' -f2 | tr -d '\r')" >> $GITHUB_OUTPUT
          echo "APPLE_ASC_PROVIDER=$(grep "^APPLE_ASC_PROVIDER=" config.properties | cut -d'=' -f2 | tr -d '\r')" >> $GITHUB_OUTPUT

      - name: Upload using iTMSTransporter
        env:
          WORKING_DIRECTORY: .
          IPA_FILE_NAME: Runner.ipa
          APPLE_ISSUER_ID: ${{ steps.config.outputs.APPLE_ISSUER_ID }}
          APPLE_KEY_ID: ${{ steps.config.outputs.APPLE_KEY_ID }}
          APPLE_ASC_PROVIDER: ${{ steps.config.outputs.APPLE_ASC_PROVIDER }}

        run: |
          cd $WORKING_DIRECTORY
          
          # 自动处理 .p8 密钥文件：如果根目录下有 .p8 文件，自动重命名并放入 private_keys 目录
          mkdir -p private_keys
          for file in *.p8; do
            if [ -f "$file" ]; then
              echo "Found .p8 file: $file. Moving to private_keys/AuthKey_${APPLE_KEY_ID}.p8"
              mv "$file" "private_keys/AuthKey_${APPLE_KEY_ID}.p8"
              break
            fi
          done
          
          if [ ! -f "private_keys/AuthKey_${APPLE_KEY_ID}.p8" ]; then
            echo "Error: private_keys/AuthKey_${APPLE_KEY_ID}.p8 not found!"
            echo "请确保已将苹果开发者后台下载的 .p8 私钥文件放置在项目根目录或 private_keys 目录下。"
            exit 1
          fi

          git clone https://github.com/ZhangLi1984/itsm.git
          
          
          # 组装上传命令
          CMD="./itsm/bin/iTMSTransporter -assetFile \"$IPA_FILE_NAME\" -apiKey \"$APPLE_KEY_ID\" -apiIssuer \"$APPLE_ISSUER_ID\" -m upload"
          
          echo "Running iTMSTransporter command..."
          eval $CMD
